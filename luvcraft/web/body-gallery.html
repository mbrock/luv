<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luvcraft bodies</title>
    <link rel="stylesheet" href="/gallery.css">
  </head>
  <body>
    <main>
      <section class="stage" aria-label="Agent body viewer">
        <canvas id="body-canvas"></canvas>
        <div class="stage-copy">
          <p class="eyebrow">Luvcraft field notes</p>
          <h1 id="body-title">Agent bodies</h1>
          <p id="status">Waking WebGPU…</p>
        </div>
        <p class="orbit-hint">drag to orbit · scroll to approach</p>
      </section>
      <aside class="workbench">
        <header>
          <p class="eyebrow">Body cabinet</p>
          <nav id="body-picker" aria-label="Choose an agent body"></nav>
        </header>
        <div id="knobs" class="knobs"></div>
        <footer>
          <button id="reset" type="button">Reset this creature</button>
          <span>WGSL compiled by luv</span>
        </footer>
      </aside>
    </main>
    <script type="module" src="/gallery.js"></script>
  </body>
</html>
