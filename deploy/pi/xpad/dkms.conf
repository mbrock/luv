# xpad from raspberrypi/linux for the running kernel, with
# xpad-reinit-on-announce.patch (see install):
# an Xbox One/Series pad turned off and on while plugged in gets its GIP
# start sequence again instead of blinking forever.  Installed under
# updates/, so it takes precedence over the kernel's own xpad.
PACKAGE_NAME="xpad-luv"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="xpad"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
