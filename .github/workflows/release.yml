name: downloadable game

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign and notarize the Mac download (requires Apple secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: game-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MACOS_NOTARIZE: ${{ github.event_name == 'release' || inputs.notarize == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://luv.swa.sh/nix-cache?priority=30
            extra-trusted-public-keys = luv.swa.sh-1:PpD45iCBkJ38ZkvlyZcLiGdIz6yVehXn3fm1JvG18Bw=
      - name: Prepare Developer ID keychain
        if: env.MACOS_NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/macos-ci-keychain
      - name: Test release packaging
        run: python3 scripts/macos-sign-release-tests.py
      - name: Build relocated Apple Silicon app
        run: scripts/build-macos-release
      - name: Test moved app without builder paths
        # Standard hosted runners do not promise a Metal 4 GPU. Full render
        # and save/reload checks use the same script on a graphical Mac.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          args=()
          if [ "$MACOS_NOTARIZE" = true ]; then args+=(--require-notarized); fi
          python3 scripts/test-macos-release.py build/macos-release/luvcraft-macos-arm64.zip build/macos-smoke --cli-only "${args[@]}"
      - name: Remove temporary signing credentials
        if: always() && env.MACOS_NOTARIZE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/luv-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/luv-certificate.p12"
      - name: Retain notarization diagnostics
        if: always() && env.MACOS_NOTARIZE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-notarization
          path: build/macos-release/notarization-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: luvcraft-macos-arm64
          path: |
            build/macos-release/luvcraft-macos-arm64.zip
            build/macos-release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  windows-sources:
    # Export the locked Lisp sources on Linux; compile them natively below.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Export pinned Lisp sources
        run: |
          mkdir -p build
          nix build --impure --expr 'import ./scripts/windows-sources.nix {}' --out-link build/windows-sources
      - uses: actions/upload-artifact@v4
        with:
          name: windows-lisp-sources
          path: build/windows-sources/lisp-sources.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: windows-sources
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-lisp-sources
          path: build/windows-sources
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install native build and software-rendering dependencies
        id: bootstrap
        shell: msys2 {0}
        run: bash scripts/windows-bootstrap.sh --with-mesa
      - name: Build and test relocated Windows game
        run: |
          python scripts/windows-build-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-build.py --sources build/windows-sources/lisp-sources.tar.gz --msys-root '${{ steps.bootstrap.outputs.msys_root }}' --output build/luvcraft-windows-x86_64 --software-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash build/luvcraft-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  luvcraft-windows-x86_64.zip" | Set-Content build/luvcraft-windows-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: luvcraft-windows-x86_64
          path: |
            build/luvcraft-windows-x86_64.zip
            build/luvcraft-windows-x86_64.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-smoke-frame
          path: build/luvcraft-windows-x86_64-smoke.png
          if-no-files-found: error

  linux:
    # Do not publish bare SBCL images that still depend on the CI Nix store.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://luv.swa.sh/nix-cache?priority=30
            extra-trusted-public-keys = luv.swa.sh-1:PpD45iCBkJ38ZkvlyZcLiGdIz6yVehXn3fm1JvG18Bw=
      - uses: Mic92/hestia@v3
      - name: Build self-contained Linux download
        run: |
          mkdir -p build/downloads
          nix build .#luvcraft-portable --out-link build/portable
          cp -L build/portable build/downloads/luvcraft-linux-x86_64.run
          chmod +x build/downloads/luvcraft-linux-x86_64.run
          cp deploy/releases.md build/downloads/README.md
          sha256sum build/downloads/luvcraft-linux-x86_64.run \
            | sed 's|build/downloads/||' > build/downloads/SHA256SUMS
      - name: Install disposable smoke-test host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers
      - name: Run moved download without the build store or checkout
        run: sh scripts/test-portable-release build/downloads/luvcraft-linux-x86_64.run build/release-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: luvcraft-linux-x86_64
          path: build/downloads/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-smoke-frame
          path: build/release-smoke.png
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: luvcraft-linux-x86_64
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          name: luvcraft-windows-x86_64
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          name: luvcraft-macos-arm64
          path: macos-downloads
      - name: Keep platform checksum files distinct
        run: |
          mv macos-downloads/SHA256SUMS downloads/luvcraft-macos-arm64.sha256
          mv macos-downloads/luvcraft-macos-arm64.zip downloads/
      - name: Attach verified downloads to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" downloads/*
