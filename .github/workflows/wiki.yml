# Render the Org wiki with (asdf:make :luv/wiki) and publish build/wiki/ to
# GitHub Pages at https://mbrock.github.io/luv/.

name: wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "wiki-*.lisp"
      - "luv-wiki.asd"
      - "luv.asd"
      - "flake.*"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Render the wiki
        run: make wiki
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wiki

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
