# Render the Org wiki and its ASDF-derived source browser, then publish
# build/wiki/ to GitHub Pages at https://mbrock.github.io/luv/.

name: wiki

on:
  push:
    branches: [main]
    paths:
      - "**/*.lisp"
      - "*.asd"
      - "wiki/**"
      - "Makefile"
      - "scripts/wiki"
      - "nix/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/hestia@v3
      - name: Render the wiki
        # Scripts refuse to run outside the dev shell, so CI enters one for
        # the whole build rather than each script arranging its own.
        run: nix develop path:./nix -c make wiki
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wiki

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
